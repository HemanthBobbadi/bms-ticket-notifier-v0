name: BMS Seat Watcher

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Manual trigger button

concurrency:
  group: seat-watcher
  cancel-in-progress: false

jobs:
  check-seats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run seat watcher
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          BMS_SEAT_URL: ${{ vars.BMS_SEAT_URL }}
          BMS_SEAT_EVENT: ${{ vars.BMS_SEAT_EVENT }}
          BMS_SEAT_DATES: ${{ vars.BMS_SEAT_DATES }}
          BMS_SEAT_SCREEN: ${{ vars.BMS_SEAT_SCREEN }}
          BMS_SEAT_TIME: ${{ vars.BMS_SEAT_TIME }}
          BMS_SEATS: ${{ vars.BMS_SEATS }}
        run: uv run --frozen seat_watcher.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seat_state.json
          git diff --cached --quiet || (git commit -m "chore: update seat_state.json [skip ci]" && git push)
